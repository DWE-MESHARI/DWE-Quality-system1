<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة جودة خدمة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/clay.css">
<link rel="stylesheet" href="clay.css"><!-- احتياطي للرفع المسطح -->
<link rel="icon" href="assets/logo.png">
<script>function logoFallback(img){if(!img.dataset.tried){img.dataset.tried=1;img.src="logo.png"}else{img.parentElement.style.display="none"}}</script><!-- الأيقونة والشعار: يحاولان assets/logo.png ثم logo.png عند الرفع المسطح -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="login" class="login"><form id="lf" class="cd">
<div class="lhead"><span class="lbox"><img src="assets/logo.png" alt="دار وإعمار" onerror="logoFallback(this)"></span><h2>نظام إدارة جودة خدمة العملاء</h2><p class="lt">دار وإعمار — تسجيل الدخول</p></div>
<div class="lbody">
<div class="fld"><label>البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username"></div>
<div class="fld"><label>كلمة المرور</label><input id="pw" type="password" required autocomplete="current-password"></div>
<button class="btn">دخول</button><p id="le"></p>
<p class="lf">نظام داخلي خاص بموظفي دار وإعمار</p>
</div></form></div>
<div class="wrap"><aside class="noprint"><div class="lg"><span class="lb"><img src="assets/logo.png" alt="دار وإعمار" onerror="logoFallback(this)"></span><span class="lt">نظام الجودة<small>دار وإعمار</small></span></div><nav id="nav"></nav><div id="who"></div></aside><div class="mn">
<header class="hero">
<h1>نظام إدارة جودة خدمة تجربة العميل — ما بعد البيع</h1>
<p id="sub"></p>
</header>
<main><div id="wn"></div><div id="top"></div><div id="out"></div></main></div></div>
<div id="toast"></div>
<script type="module">
  // يحمّل js/app.js، وإن لم يوجد (رفع الملفات بدون مجلدات) يحمّل app.js من نفس المستوى
  const ok = async u => { try { return (await fetch(u, { method: 'HEAD' })).ok } catch (e) { return false } };
  const p = (await ok('js/app.js')) ? './js/app.js' : './app.js';
  import(p).catch(e => { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;color:#b00">تعذّر تحميل ملفات النظام (' + p + '). تأكدي أن مجلدي css وjs مرفوعان في المستودع بنفس الهيكل.</p>'); console.error(e) });
</script>
</body></html>
